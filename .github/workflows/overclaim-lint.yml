name: overclaim-lint

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  lint:
    name: Numeric claim lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conformance
        uses: actions/checkout@v4
        with:
          path: synoi-conformance

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run overclaim linter
        run: node synoi-conformance/tools/overclaim-linter/overclaim-lint.cjs synoi-conformance

      - name: Run linter self-test
        run: node synoi-conformance/tools/overclaim-linter/overclaim-lint.test.cjs
