name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install non-@synoi deps first, then the published @synoi/* packages by
      # explicit version (forces registry resolution; a plain range install of
      # the multi-package @synoi graph is skipped by npm). No sibling checkout,
      # no token.
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @synoi/sraid@0.2.0 @synoi/verify@0.1.0 @synoi/gap@1.1.0 @synoi/oid-resolver@0.1.0
      - run: npm run typecheck --if-present
      - run: npm run test:ci
      - run: npm run build --if-present
